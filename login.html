<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Eddyforge</title>
  <link rel="icon" type="image/png" href="eddyforge-logo.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <style>
    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated grid background */
    .login-page::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 20%, transparent 100%);
      pointer-events: none;
      animation: gridPulse 8s ease-in-out infinite;
    }

    @keyframes gridPulse {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 1; }
    }

    /* Glowing orb */
    .login-orb {
      position: fixed;
      top: -200px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,214,255,.14) 0%, transparent 65%);
      pointer-events: none;
      animation: orbFloat 10s ease-in-out infinite;
    }
    @keyframes orbFloat {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(40px); }
    }

    /* Login card */
    .login-card {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 44px;
      box-shadow: 0 32px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(0,214,255,.06);
    }

    .login-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      border-radius: 20px 20px 0 0;
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .login-logo-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      background: var(--bg-2);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 0 4px var(--cyan-dim);
    }

    .login-logo-avatar img {
      width: 100%; height: 100%;
      object-fit: contain;
    }

    .login-logo-text {
      font-family: var(--body);
      font-weight: 800;
      font-size: 1.2rem;
      color: #fff;
      letter-spacing: -.02em;
    }

    .login-eyebrow {
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--cyan);
      letter-spacing: .15em;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .login-eyebrow::before {
      content: '';
      display: block;
      width: 20px; height: 1px;
      background: var(--cyan);
    }

    .login-title {
      font-family: var(--body);
      font-weight: 800;
      font-size: 1.75rem;
      color: #fff;
      letter-spacing: -.04em;
      margin-bottom: 8px;
    }

    .login-sub {
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1rem;
      pointer-events: none;
      transition: color .2s;
    }

    .login-input {
      width: 100%;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: var(--body);
      font-size: .95rem;
      padding: 13px 44px 13px 42px;
      outline: none;
      transition: border-color .25s, box-shadow .25s;
    }
    .login-input::placeholder { color: var(--muted); }
    .login-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-dim);
    }
    .login-input:focus + .input-icon,
    .input-wrapper:has(.login-input:focus) .input-icon {
      color: var(--cyan);
    }

    .pw-toggle {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px;
      transition: color .2s;
    }
    .pw-toggle:hover { color: var(--cyan); }

    .login-btn {
      width: 100%;
      background: var(--cyan);
      color: var(--bg);
      border: none;
      border-radius: 50px;
      padding: 14px;
      font-family: var(--body);
      font-weight: 700;
      font-size: .95rem;
      letter-spacing: .02em;
      cursor: pointer;
      transition: box-shadow .25s, transform .25s, opacity .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
    }
    .login-btn:hover:not(:disabled) {
      box-shadow: 0 0 40px var(--cyan-glow);
      transform: translateY(-2px);
    }
    .login-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    /* Error message */
    .login-error {
      display: none;
      background: rgba(239,68,68,.1);
      border: 1px solid rgba(239,68,68,.3);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      color: #f87171;
      font-size: .875rem;
      align-items: center;
      gap: 10px;
    }
    .login-error.show { display: flex; }

    /* Success flash */
    .login-success {
      display: none;
      background: rgba(0,214,255,.1);
      border: 1px solid rgba(0,214,255,.3);
      border-radius: 10px;
      padding: 12px 16px;
      margin-bottom: 18px;
      color: var(--cyan);
      font-size: .875rem;
      align-items: center;
      gap: 10px;
    }
    .login-success.show { display: flex; }

    /* Security badge */
    .security-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-family: var(--mono);
      font-size: .68rem;
      color: var(--muted);
      letter-spacing: .06em;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 20px;
      color: var(--muted);
      font-size: .85rem;
      text-decoration: none;
      transition: color .2s;
    }
    .back-link:hover { color: var(--cyan); }

    /* Loading spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(6,8,16,.3);
      border-top-color: var(--bg);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }

    @media (max-width: 480px) {
      .login-card { padding: 36px 24px; }
    }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-orb"></div>

    <div class="login-card">
      <!-- Logo -->
      <div class="login-logo">
        <div class="login-logo-avatar">
          <img src="eddyforge-logo.png" alt="Eddyforge">
        </div>
        <span class="login-logo-text">Eddyforge</span>
      </div>

      <!-- Header -->
      <div class="login-eyebrow">Admin Access</div>
      <h1 class="login-title">Welcome back</h1>
      <p class="login-sub">Sign in to access the admin dashboard and manage your portfolio content.</p>

      <!-- Error / Success -->
      <div class="login-error" id="loginError">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span id="errorMsg">Invalid credentials. Please try again.</span>
      </div>
      <div class="login-success" id="loginSuccess">
        <i class="bi bi-check-circle-fill"></i>
        <span>Authenticated! Redirecting to dashboard...</span>
      </div>

      <!-- Form -->
      <div class="input-group">
        <label class="form-label-c">Username</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="username"
            class="login-input"
            placeholder="admin"
            autocomplete="username"
            spellcheck="false"
          />
          <i class="bi bi-person input-icon"></i>
        </div>
      </div>

      <div class="input-group">
        <label class="form-label-c">Password</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            class="login-input"
            placeholder="••••••••••••"
            autocomplete="current-password"
          />
          <i class="bi bi-lock input-icon"></i>
          <button class="pw-toggle" id="pwToggle" type="button" tabindex="-1" aria-label="Toggle password">
            <i class="bi bi-eye" id="pwIcon"></i>
          </button>
        </div>
      </div>

      <button class="login-btn" id="loginBtn">
        <span id="btnText">Sign In</span>
        <div class="spinner" id="spinner"></div>
        <i class="bi bi-arrow-right" id="btnIcon"></i>
      </button>

      <div class="security-note">
        <i class="bi bi-shield-lock-fill" style="color:var(--cyan);"></i>
        Session-based authentication · Secure access only
      </div>
    </div>

    <a href="index.html" class="back-link">
      <i class="bi bi-arrow-left"></i> Back to portfolio
    </a>
  </div>

  <script>
    // ── CREDENTIALS (SHA-256 hashed) ──
    // Username: eddyforge_admin
    // Password: Eddyforge@Admin2026
    const ADMIN_USERNAME_HASH = '19321ea240a35d891b80c4b2b0521f320f63538191fc77bd311ed26678bd0cec'; // eddyforge_admin
    const ADMIN_PASSWORD_HASH = '3da5e158f935255920c74ce4061ec95d0efbdd8b568ef9b4a236c63ed322b638'; // Eddyforge@Admin2026

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    // If already logged in, go straight to admin
    if (sessionStorage.getItem('et_admin_auth') === 'granted') {
      window.location.href = 'admin.html';
    }

    const loginBtn  = document.getElementById('loginBtn');
    const btnText   = document.getElementById('btnText');
    const btnIcon   = document.getElementById('btnIcon');
    const spinner   = document.getElementById('spinner');
    const errorEl   = document.getElementById('loginError');
    const successEl = document.getElementById('loginSuccess');
    const pwToggle  = document.getElementById('pwToggle');
    const pwInput   = document.getElementById('password');
    const pwIcon    = document.getElementById('pwIcon');

    // Password visibility toggle
    pwToggle.addEventListener('click', () => {
      const isHidden = pwInput.type === 'password';
      pwInput.type = isHidden ? 'text' : 'password';
      pwIcon.className = isHidden ? 'bi bi-eye-slash' : 'bi bi-eye';
    });

    // Submit on Enter
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleLogin();
    });

    loginBtn.addEventListener('click', handleLogin);

    function showLoading(on) {
      loginBtn.disabled = on;
      btnText.textContent = on ? 'Verifying...' : 'Sign In';
      spinner.style.display = on ? 'block' : 'none';
      btnIcon.style.display = on ? 'none' : 'block';
    }

    async function handleLogin() {
      const username = document.getElementById('username').value.trim();
      const password = pwInput.value;

      errorEl.classList.remove('show');
      successEl.classList.remove('show');

      if (!username || !password) {
        document.getElementById('errorMsg').textContent = 'Please enter both username and password.';
        errorEl.classList.add('show');
        return;
      }

      showLoading(true);

      // Small artificial delay so it feels like a real auth check
      await new Promise(r => setTimeout(r, 800));

      const [uHash, pHash] = await Promise.all([sha256(username), sha256(password)]);

      if (uHash === ADMIN_USERNAME_HASH && pHash === ADMIN_PASSWORD_HASH) {
        successEl.classList.add('show');
        sessionStorage.setItem('et_admin_auth', 'granted');
        sessionStorage.setItem('et_admin_user', username);
        setTimeout(() => { window.location.href = 'admin.html'; }, 1000);
      } else {
        showLoading(false);
        document.getElementById('errorMsg').textContent = 'Invalid credentials. Please try again.';
        errorEl.classList.add('show');
        // Shake the card
        const card = document.querySelector('.login-card');
        card.style.animation = 'shake .4s ease';
        setTimeout(() => card.style.animation = '', 400);
      }
    }

    // Shake keyframe
    const style = document.createElement('style');
    style.textContent = `
      @keyframes shake {
        0%,100% { transform: translateX(0); }
        20%      { transform: translateX(-8px); }
        40%      { transform: translateX(8px); }
        60%      { transform: translateX(-5px); }
        80%      { transform: translateX(5px); }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
